name = "holdshort"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "command -v worker-build >/dev/null || cargo install -q worker-build@0.8.7; worker-build --release"

[triggers]
crons = ["* * * * *"]

[durable_objects]
bindings = [{ name = "INGEST", class_name = "Ingest" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ingest"]

[[d1_databases]]
binding = "DB"
database_name = "holdshort"
database_id = "6b01499f-78e6-4af7-aaab-4e9faab2905d"
migrations_dir = "migrations"
