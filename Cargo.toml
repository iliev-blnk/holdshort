# A Cargo workspace: several crates sharing one target/ dir and one Cargo.lock.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
holdshort-core = { path = "crates/core" }
holdshort-twin = { path = "crates/twin" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
